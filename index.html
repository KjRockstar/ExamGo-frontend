*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f5fb;--bg3:#edebf7;

  --border:#e4e0f2;--border2:#cfc8e8;
  --purple:#7F77DD;--green:#3B6D11;--blue:#185FA5;--amber:#854F0B;
  --green-bg:#EAF3DE;--blue-bg:#E6F1FB;--amber-bg:#FAEEDA;
  --radius:8px;--radius-lg:12px;
  --grad1:#7F77DD;--grad2:#A78BE0;--grad3:#6EC6C0;--grad4:#F0997B;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1d1a2e;--bg2:#252238;--bg3:#2d2944;
    --text:#f0eefa;--text2:#b3aecb;--text3:#8a84a0;
    --border:#3a3554;--border2:#4a4468;
    --green:#9FE1CB;--blue:#B5D4F4;--amber:#FAC775;
    --green-bg:#085041;--blue-bg:#0C447C;--amber-bg:#633806;
  }
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);min-height:100vh;font-size:15px;
  background:
    radial-gradient(circle at 8% 12%, rgba(127,119,221,0.30), transparent 42%),
    radial-gradient(circle at 92% 8%, rgba(110,198,192,0.28), transparent 45%),
    radial-gradient(circle at 85% 88%, rgba(240,153,123,0.25), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(167,139,224,0.28), transparent 45%),
    linear-gradient(160deg, #f3f1fc 0%, #eef3fa 50%, #fbf2f4 100%);
  background-attachment:fixed;
}
@media(prefers-color-scheme:dark){
  body{
    background:
      radial-gradient(circle at 8% 12%, rgba(127,119,221,0.22), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(110,198,192,0.18), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(240,153,123,0.16), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(167,139,224,0.18), transparent 45%),
      linear-gradient(160deg, #181527 0%, #1b1830 50%, #1f1a26 100%);
    background-attachment:fixed;
  }
}
.app-wrap{max-width:900px;margin:0 auto;padding:1.5rem 1rem 3rem}
.header{
  margin-bottom:1.5rem;padding:1.25rem 1.5rem;border-radius:var(--radius-lg);
  background:linear-gradient(120deg, rgba(127,119,221,0.14), rgba(110,198,192,0.10));
  border:0.5px solid var(--border);
  backdrop-filter:blur(6px);
}
.header h1{font-size:26px;font-weight:700;margin-bottom:4px;letter-spacing:-0.3px}
.header h1 .accent{background:linear-gradient(120deg,var(--grad1),var(--grad3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header h1 span.meta{font-size:15px;font-weight:400;color:var(--text2);margin-left:8px}
.header p{font-size:14px;color:var(--text2)}
.controls{margin-bottom:1.25rem}
select{width:100%;max-width:420px;padding:9px 12px;font-size:14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer;outline:none;box-shadow:0 1px 3px rgba(127,119,221,0.08)}
select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,0.15)}
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:1.5rem;background:rgba(255,255,255,0.4);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:4px;backdrop-filter:blur(4px)}
.tab{padding:9px 18px;font-size:14px;cursor:pointer;border:none;background:none;color:var(--text2);border-radius:var(--radius);border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--text);background:var(--bg);border-bottom-color:var(--purple);box-shadow:0 1px 4px rgba(127,119,221,0.12)}
.tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.5)}
.section-header{font-size:13px;font-weight:600;color:var(--text2);padding:10px 0 6px;border-bottom:0.5px solid var(--border);margin-bottom:8px;margin-top:16px;text-transform:uppercase;letter-spacing:.5px}
.section-header:first-child{margin-top:0}
.papers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:8px}
.paper-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.125rem;display:flex;flex-direction:column;gap:8px;transition:all .15s;box-shadow:0 1px 6px rgba(60,40,120,0.05)}
.paper-card:hover{border-color:var(--purple);box-shadow:0 4px 14px rgba(127,119,221,0.14);transform:translateY(-1px)}
.paper-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.paper-title{font-size:14px;font-weight:600;line-height:1.4;color:var(--text)}
.paper-year{font-size:11px;background:var(--bg2);padding:3px 8px;border-radius:var(--radius);color:var(--text3);white-space:nowrap;flex-shrink:0;border:0.5px solid var(--border)}
.paper-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:3px 8px;border-radius:var(--radius);font-weight:600}
.badge-cat1{background:var(--green-bg);color:var(--green)}
.badge-cat2{background:var(--blue-bg);color:var(--blue)}
.badge-fat{background:var(--amber-bg);color:var(--amber)}
.badge-slot{background:var(--bg2);color:var(--text3);border:0.5px solid var(--border)}
.q-count{font-size:11px;color:var(--text3)}
.toggle-btn{background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.toggle-btn:hover{background:var(--bg2);color:var(--text)}
.q-sections{margin-top:4px}
.q-sec-title{font-size:11px;font-weight:600;color:var(--text3);padding:6px 0 3px;text-transform:uppercase;letter-spacing:.3px}
.q-list{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.q-item{font-size:12.5px;line-height:1.6;padding:7px 10px;background:var(--bg2);border-radius:var(--radius);border-left:3px solid var(--border2);color:var(--text);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.q-item.m2{border-left-color:#9FE1CB}
.q-item.m3{border-left-color:#7F77DD}
.q-item.m5{border-left-color:#F0997B}
.q-text{flex:1}
.q-marks{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--text3);white-space:nowrap;flex-shrink:0;font-weight:600;border:0.5px solid var(--border)}
.topic-wrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;box-shadow:0 1px 6px rgba(60,40,120,0.05)}
.topic-list{display:flex;flex-direction:column;gap:10px;margin:1rem 0}
.topic-row{display:flex;align-items:center;gap:12px}
.topic-name{font-size:13px;color:var(--text);width:210px;flex-shrink:0;line-height:1.4}
.topic-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;border:0.5px solid var(--border)}
.topic-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--grad1),var(--grad3));transition:width .4s ease}
.topic-count{font-size:12px;color:var(--text2);width:44px;text-align:right;flex-shrink:0;font-weight:600}
.tip-box{background:linear-gradient(120deg, rgba(127,119,221,0.10), rgba(240,153,123,0.08));border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.125rem 1.25rem;margin-top:1rem}
.tip-box h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text)}
.tip-box p{font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:6px}
.tip-box p:last-child{margin-bottom:0}
.ai-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 6px rgba(60,40,120,0.05)}
.ai-section h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text)}
.ai-section p{font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:12px}
.ai-btns{display:flex;gap:8px;flex-wrap:wrap}
.ai-btn{padding:8px 16px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:linear-gradient(120deg, rgba(127,119,221,0.10), rgba(110,198,192,0.08));color:var(--text);cursor:pointer;transition:all .15s;font-weight:500}
.ai-btn:hover{background:linear-gradient(120deg, rgba(127,119,221,0.20), rgba(110,198,192,0.16));border-color:var(--purple)}
.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-output{margin-top:1.25rem;font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;background:var(--bg2);border-radius:var(--radius-lg);padding:1.125rem;border:0.5px solid var(--border);min-height:60px}
.ai-output.loading{color:var(--text3);font-style:italic}
.empty{padding:2.5rem;text-align:center;color:var(--text3);font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%}
footer{margin-top:2rem;padding-top:1rem;border-top:0.5px solid var(--border);text-align:center;font-size:12px;color:var(--text3)}
</style>
</head>

let currentSubject = 'phy';
let currentTab = 'papers';
let aiLoading = false;

function onSubjectChange(){
  currentSubject = document.getElementById('subjectSel').value;
  renderTab();
}

function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['papers','topics','ai'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'':'none';
  });
  renderTab();
}

function renderTab(){
  if(currentTab==='papers') renderPapers();
  else if(currentTab==='topics') renderTopics();
  else renderAI();
}

function renderPapers(){
  const d = DATA[currentSubject];
  const container = document.getElementById('tab-papers');
  let html = '';
  ['CAT1','CAT2','FAT'].forEach(type=>{
    const papers = d.papers.filter(p=>p.type===type);
    if(!papers.length) return;
    const label = type==='CAT1'?'CAT 1 Papers':type==='CAT2'?'CAT 2 Papers':'FAT Papers';
    html += `<div class="section-header">${label}</div><div class="papers-grid">`;
    papers.forEach(p=>{
      const bc = type==='CAT1'?'badge-cat1':type==='CAT2'?'badge-cat2':'badge-fat';
      const totalQs = p.sections.reduce((s,sec)=>s+sec.qs.length,0);
      const key = `${currentSubject}-${type}-${p.slot}`;
      html += `<div class="paper-card">
        <div class="paper-top">
          <div class="paper-title">${p.type} — Slot ${p.slot}</div>
          <span class="paper-year">${p.year}</span>
        </div>
        <div class="paper-meta">
          <span class="badge ${bc}">${p.type}</span>
          <span class="badge badge-slot">Slot ${p.slot}</span>
          <span class="q-count">${totalQs} questions</span>
        </div>
        <button class="toggle-btn" onclick="toggleQ(this,'${key}')">
          <i class="ti ti-chevron-down"></i> View questions
        </button>
        <div id="qs-${key}" style="display:none">${buildQHTML(p.sections)}</div>
      </div>`;
    });
    html += '</div>';
  });
  container.innerHTML = html || '<div class="empty">No papers available yet.</div>';
}

function buildQHTML(sections){
  return sections.map(sec=>`
    <div class="q-sec-title">${sec.title}</div>
    <div class="q-list">${sec.qs.map(q=>`
      <div class="q-item m${q.marks}">
        <span class="q-text">${q.text}</span>
        <span class="q-marks">${q.marks}M</span>
      </div>`).join('')}
    </div>`).join('');
}

function toggleQ(btn, key){
  const div = document.getElementById('qs-'+key);
  const open = div.style.display !== 'none';
  div.style.display = open ? 'none' : '';
  btn.innerHTML = open
    ? '<i class="ti ti-chevron-down"></i> View questions'
    : '<i class="ti ti-chevron-up"></i> Hide questions';
}

function renderTopics(){
  const d = DATA[currentSubject];
  const container = document.getElementById('tab-topics');
  const sorted = [...d.topics].sort((a,b)=>b.count-a.count);
  const maxCount = sorted[0].count;
  let html = `<div class="topic-wrap">
    <p style="font-size:14px;color:var(--text2);margin-bottom:4px">Topic frequency across all <strong>${d.papers.length} papers</strong> for ${d.name}</p>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#9FE1CB"></div> 2-mark questions</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7F77DD"></div> 3-mark questions</div>
      <div class="legend-item"><div class="legend-dot" style="background:#F0997B"></div> 5-mark questions</div>
    </div>
    <div class="topic-list">`;
  sorted.forEach(t=>{
    const pct = Math.round((t.count/maxCount)*100);
    const priority = t.count >= maxCount*0.8 ? '🔴 High' : t.count >= maxCount*0.5 ? '🟡 Medium' : '⚪ Low';
    html += `<div class="topic-row">
      <span class="topic-name" title="${priority} priority">${t.name}</span>
      <div class="topic-bar-wrap"><div class="topic-bar" style="width:${pct}%"></div></div>
      <span class="topic-count">${t.count}/${t.max}</span>
    </div>`;
  });
  html += `</div></div>
  <div class="tip-box">
    <h3>Study strategy</h3>
    <p>Topics appearing in <strong>${Math.ceil(maxCount*0.8)}+/${maxCount} papers</strong> are very high priority — nearly guaranteed to appear. Prepare these thoroughly for both 2-mark and 5-mark formats.</p>
    <p>For CAT exams: master Part A (2-mark) questions for breadth coverage. For FAT: prepare Part C (5-mark) derivations and proofs in detail — they carry the most marks per question.</p>
    <p>Focus on the top 5 topics first — they collectively cover 60–70% of all exam marks historically.</p>
  </div>`;
  container.innerHTML = html;
}

function renderAI(){
  const d = DATA[currentSubject];
  document.getElementById('tab-ai').innerHTML = `
    <div class="ai-section">
      <h3>AI Exam Predictions</h3>
      <p>Get AI-powered predictions for your next exam based on pattern analysis of all ${d.papers.length} ${d.name} papers. Select exam type:</p>
      <div class="ai-btns">
        <button class="ai-btn" onclick="getAIPrediction('CAT1',this)"><i class="ti ti-sparkles"></i> Predict CAT 1</button>
        <button class="ai-btn" onclick="getAIPrediction('CAT2',this)"><i class="ti ti-sparkles"></i> Predict CAT 2</button>
        <button class="ai-btn" onclick="getAIPrediction('FAT',this)"><i class="ti ti-sparkles"></i> Predict FAT</button>
      </div>
      <div id="ai-output" style="display:none" class="ai-output"></div>
    </div>`;
}

const EXAMGO_BACKEND_URL = 'https://examgo-hvmp.onrender.com';

async function getAIPrediction(examType, btn){
  if(aiLoading) return;
  aiLoading = true;
  const btns = document.querySelectorAll('.ai-btn');
  btns.forEach(b=>b.disabled=true);
  const output = document.getElementById('ai-output');
  output.style.display = 'block';
  output.className = 'ai-output loading';
  output.textContent = 'Analyzing past papers…';

  const d = DATA[currentSubject];

  // Pull the REAL questions from this subject's papers that match the selected exam type
  const matchingPapers = d.papers.filter(p => p.type === examType);
  const pastQuestions = [];
  matchingPapers.forEach(p => {
    p.sections.forEach(sec => {
      sec.qs.forEach(q => {
        pastQuestions.push(`[${sec.title}, ${q.marks}M] ${q.text}`);
      });
    });
  });

  if (pastQuestions.length === 0) {
    output.className = 'ai-output';
    output.textContent = `No ${examType} papers available yet for ${d.name} to analyze.`;
    btns.forEach(b=>b.disabled=false);
    aiLoading = false;
    return;
  }

  try {
    const r = await fetch(`${EXAMGO_BACKEND_URL}/api/predict`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        subjectName: d.name,
        examType: examType,
        paperCount: matchingPapers.length,
        pastQuestions: pastQuestions
      })
    });

    if (!r.ok) {
      const errData = await r.json().catch(()=>({}));
      throw new Error(errData.error || `Server returned ${r.status}`);
    }

    const data = await r.json();
    output.className = 'ai-output';
    output.textContent = data.prediction || 'Unable to generate prediction.';
  } catch(e) {
    output.className = 'ai-output';
    output.textContent = 'Error: Could not reach the prediction server. Please try again in a moment.';
    console.error('Prediction error:', e);
  }
  btns.forEach(b=>b.disabled=false);
  aiLoading = false;
}

renderPapers();
</script>
